name: reader
initial: reading

states:
  reading:
    probe:
      prompt: |
        Reading Check-In:
        Based on what I have read so far from the document, what is my next action?
        1: Continue reading next segment
        2: Pause to make a distilled note
        3: Pause to ask the user a clarifying question
        4: Pause to emit a progress update
        0: Reading complete, proceed to final response
        Answer with only the index number:
      candidates:
        - key: "1"
          op: read_next_chunk
          target: reading
        - key: "2"
          op: prepare_note
          target: reflecting
        - key: "3"
          op: ask_user
          target: awaiting_user
        - key: "4"
          op: emit_progress
          target: reading
        - key: "0"
          op: finalize_reading
          target: idle

  reflecting:
    probe:
      prompt: |
        Distill the key takeaway from the recent reading segment in 1 to 2 sentences:
      maxTokens: 32
      op: save_note
      target: reading

  awaiting_user:
    probe:
      prompt: |
        Awaiting clarification from the user:
        1: Wait for user input
        2: Resume reading with best guess
        Answer with only the index number:
      candidates:
        - key: "1"
          op: yield
          target: awaiting_user
        - key: "2"
          op: read_next_chunk
          target: reading
