name: reader
initial: reading

states:
  reading:
    probe:
      prompt: |
        Reading Check-In for active channel:
        1: Continue reading next segment
        2: Pause to make a distilled note of a key finding
        3: Pause to ask the user a clarifying question
        0: Reading complete, proceed to synthesis and response
        Answer with only the index number:
      candidates:
        - key: "1"
          op: pull_next_chunk
          target: reading
        - key: "2"
          op: prepare_note
          target: reflecting
        - key: "3"
          op: ask_user
          target: awaiting_user
        - key: "0"
          op: finalize_reading
          target: synthesizing

  reflecting:
    probe:
      prompt: |
        Distill the key takeaway from the recent reading segment in 1 to 2 sentences:
      maxTokens: 32
      op: save_note
      target: reading

  awaiting_user:
    probe:
      prompt: |
        Awaiting clarification from the user:
        1: Wait for user input
        2: Resume reading with best guess
        Answer with only the index number:
      candidates:
        - key: "1"
          op: yield
          target: awaiting_user
        - key: "2"
          op: pull_next_chunk
          target: reading

  synthesizing:
    probe:
      prompt: |
        Thinking Gate Evaluation:
        0: Unnecessary (simple greeting, direct acknowledgment, straightforward answer)
        1: Essential (deep reasoning, technical synthesis, multi-step analysis)
        Decision:
      candidates:
        - key: "0"
          op: direct_response
          target: idle
        - key: "1"
          op: think
          target: idle

  idle:
    probe:
      prompt: |
        Idle State:
        1: Wait for new input on focused channel
        2: Check background notification queue
        Answer with only the index number:
      candidates:
        - key: "1"
          op: yield
          target: idle
        - key: "2"
          op: check_backlog
          target: idle
