name: chat
initial: idle

states:
  idle:
    probe:
      prompt: |
        Classify idle priority:
        1: Wait for user input
        2: Resume pending background task
        Answer with only the index number:
      candidates:
        - key: "1"
          op: yield
          target: idle
        - key: "2"
          op: resume_task
          target: idle

  on_input:
    probe:
      prompt: |
        Classify whether the incoming user message is a constraint, follow-up, or steering for an active task, or a new independent task.

        Active tasks:
        {{candList}}
        0: New independent task

        Incoming message: "{{val}}"

        Answer with only the index number:
      candidates:
        - key: "0"
          op: create_task
          target: titling
        - key: "1"
          op: steer_task
          target: responding

  titling:
    probe:
      prompt: |
        Provide a concise 2 to 5 word title for this user request:
        "{{valSample}}"
        Output only the title, nothing else.
      maxTokens: 14
      op: set_title
      target: responding

  responding:
    probe:
      prompt: |
        Thinking Gate Evaluation:
        0: Unnecessary (simple greeting, trivial fact, brief acknowledgment, or immediate direct response)
        1: Essential (coding, complex logical analysis, multi-step math, tool planning)
        Decision:
      candidates:
        - key: "0"
          op: direct_response
          target: idle
        - key: "1"
          op: think
          target: idle
