name: focus
initial: evaluate_interrupt

states:
  evaluate_interrupt:
    probe:
      prompt: |
        Focus Evaluation:
        An event has arrived on background channel "{{incomingChannel}}":
        "{{preview}}"

        Active focused channel is: "{{focusedChannel}}"

        Should focus immediately switch to "{{incomingChannel}}"?
        0: No, remain on current focus (queue event in background alerts)
        1: Yes, switch focus immediately to "{{incomingChannel}}"
        Decision:
      candidates:
        - key: "0"
          op: bookmark_interrupt
          target: idle
        - key: "1"
          op: switch_focus
          target: idle

  idle:
    probe:
      prompt: |
        Idle focus:
        1: Maintain active focus
        Decision:
      candidates:
        - key: "1"
          op: yield
          target: idle
