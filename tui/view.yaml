classes:
  '@theme.yaml:classes': '*'

type: layout
direction: vertical
width: fill
height: fill
bg: '#1a1b26'
onKeyPreview: '@controller:onGlobalKey'
onKey: '@controller:onGlobalKey'

inner:
  # Header Bar
  - type: border
    borderStyle: single
    borderFg: '#3b4261'
    height: 3
    inner:
      - type: layout
        direction: horizontal
        width: fill
        inner:
          - type: text
            text: ' SULLUX COGNITIVE ENGINE '
            bold: true
            fg: '#7aa2f7'
          - type: text
            text: '● Online'
            fg: '#9ece6a'
            margin: { left: 2 }
          - type: text
            text: '@controller:getStatusText'
            fg: '#bb9af7'
            margin: { left: 3 }

  # Main Content Split (3-Column Layout: Conversation + Input | Stream | Plan Stack)
  - type: layout
    direction: horizontal
    height: fill
    inner:
      # Left Column: Conversation + Pinned Input Box
      - type: layout
        direction: vertical
        width: 40%
        height: fill
        inner:
          # Scrollable Conversation Messages
          - type: border
            borderStyle: rounded
            borderFg: '#7aa2f7'
            height: fill
            inner:
              - type: scroll
                direction: vertical
                height: fill
                inner:
                  - type: layout
                    direction: vertical
                    inner: '@controller:getConversationNodes'

          # Input Box (Pinned strictly at bottom of Conversation Column)
          - type: border
            borderStyle: rounded
            borderFg: '#e0af68'
            height: content
            margin: { top: 1 }
            inner:
              - type: input
                id: chatInput
                wrap: true
                maxHeight: 6
                placeholder: 'Type a message or prompt... (Enter to send, Shift+Enter for newline)'
                placeholderStyle:
                  fg: '#565f89'
                  italic: true
                caret:
                  mode: invert
                unfocusedCaret:
                  bg: '#33384c'
                  fg: '#a9b1d6'
                onSubmit: '@controller:onSubmitInput'

      # Middle Column: Live Stream (Telemetry, Thoughts & Tools)
      - type: layout
        direction: vertical
        width: 40%
        height: fill
        margin: { left: 1 }
        inner:
          - type: border
            borderStyle: rounded
            borderFg: '#bb9af7'
            height: fill
            inner:
              - type: scroll
                direction: vertical
                height: fill
                inner:
                  - type: layout
                    direction: vertical
                    inner: '@controller:getStreamNodes'

      # Right Column: Plan Stack & Task Tree
      - type: layout
        direction: vertical
        width: 20%
        height: fill
        margin: { left: 1 }
        inner:
          - type: border
            borderStyle: rounded
            borderFg: '#9ece6a'
            height: fill
            inner:
              - type: scroll
                direction: vertical
                height: fill
                inner:
                  - type: layout
                    direction: vertical
                    inner: '@controller:getPlanNodes'

  # Dynamic Footer Status & Shortcuts Bar
  - type: layout
    direction: horizontal
    height: 1
    inner:
      - type: text
        text: '@controller:getShortcutsText'
        fg: '#565f89'
